name: Outside pull requests

# HelpWell does not accept pull requests from outside the project yet (see
# CONTRIBUTING.md). This closes them with a pointer to issues. It never checks
# out or runs the pull request's code, so pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                'Thank you for this. HelpWell is not accepting pull requests from outside the project yet, so this one is being closed.',
                '',
                'Please open an [issue](https://github.com/' + owner + '/' + repo + '/issues/new/choose) describing the bug or the change instead. The maintainers will pick it up from there, and credit you when it lands. [CONTRIBUTING.md](https://github.com/' + owner + '/' + repo + '/blob/main/CONTRIBUTING.md) explains why.',
              ].join('\n'),
            });
            await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: 'closed' });
